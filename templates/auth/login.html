{% extends "base.html" %}
{% block title %}Connexion — The Library{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8">
  <h2 class="text-2xl font-bold text-indigo-700 mb-6">Connexion</h2>
  <form method="POST" action="{{ url_for('pages.login') }}" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" required
             class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
      <input type="password" name="password" required
             class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    </div>
    <button type="submit"
            class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">
      Se connecter
    </button>
  </form>
  <p class="text-center text-sm text-gray-500 mt-4">
    Pas encore de compte ?
    <a href="{{ url_for('pages.register') }}" class="text-indigo-600 hover:underline">S'inscrire</a>
  </p>
</div>
{% endblock %}
